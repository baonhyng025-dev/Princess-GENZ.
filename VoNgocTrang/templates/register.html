<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Tài Khoản - Thời Trang GenZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF7F7] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-stone-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Tạo Tài Khoản</h1>
            <p class="text-xs text-stone-500 mt-2">Gia nhập cộng đồng GenZ</p>
        </div>

        {% if error %}
        <div class="bg-rose-50 text-rose-500 text-xs p-3 rounded-lg text-center mb-6 border border-rose-100">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Tên đăng nhập</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-stone-50/70 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-[#d4a0a3] transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Mật khẩu</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-stone-50/70 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-[#d4a0a3] transition">
            </div>
            
            <button type="submit" class="w-full mt-2 py-3.5 bg-[#d4a0a3] hover:bg-[#c38f92] text-white font-semibold rounded-xl text-sm tracking-wide shadow-md transition">
                ĐĂNG KÝ NGAY
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/login" class="text-xs text-stone-500 hover:text-gray-900 transition">Đã có tài khoản? <span class="font-bold underline decoration-[#C9969A] underline-offset-4">Đăng nhập</span></a>
        </div>
    </div>

</body>
</html>
